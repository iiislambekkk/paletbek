<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1677c8" />
    <title>Нет подключения — Палетбек</title>
    <style>
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f8fafc; color: #172033; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
      main { max-width: 360px; }
      h1 { margin-bottom: 8px; font-size: 1.5rem; }
      p { color: #526176; }
      button { min-height: 48px; margin-top: 12px; padding: 0 20px; border: 0; border-radius: 12px; background: #1677c8; color: white; font: inherit; font-weight: 600; }
      @media (prefers-color-scheme: dark) { body { background: #111827; color: #f8fafc; } p { color: #cbd5e1; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Нет подключения к интернету</h1>
      <p>Когда связь появится, обновите страницу, чтобы продолжить работу с Палетбеком.</p>
      <button onclick="location.reload()">Повторить</button>
    </main>
  </body>
</html>
